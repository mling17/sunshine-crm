# ===== CRM V1 反向代理片段 =====
# 用法：由 @coder 在 T1 时把下面整段插入 /root/nginx/conf.d/default.conf，
#       插在 "学习知识库" 那组 location 之后、"Hindsight" 之前即可。
#       【不新建 server 块】——现有 nginx 只 listen 80，多一个同 server_name 的
#       server 块只会产生 conflicting server name 警告，得不偿失。
#
# 上线前必须做：
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload
# 回滚：
#   cp /root/nginx/conf.d/default.conf.bak-<stamp> /root/nginx/conf.d/default.conf
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload

    # ===== CRM V1 入口（运维 @ops 提供，2026-10-29）=====
    location = /crm {
        return 301 /crm/;
    }

    # CRM 前端静态资源（PWA：manifest / sw / 图标）
    location /crm/static/ {
        alias /usr/share/nginx/html/crm/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # CRM 前端主页面（H5 + PWA，无构建产物，静态文件）
    location /crm/ {
        alias /usr/share/nginx/html/crm/;
        try_files $uri $uri/ /crm/index.html;
        # 单页应用：不缓存 index.html，避免发版后用户看到旧壳
        location = /crm/index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # CRM API 反向代理（去掉 /crm 前缀 → 后端是 /api/crm/...）
    location ~ ^/crm/api/(.*)$ {
        proxy_pass http://10.113.9.77:8010/api/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        # 照片上传：手机拍照单张 3-8MB，3 张留足余量
        client_max_body_size 100M;
        proxy_read_timeout 120s;
    }

    # 健康检查（不进鉴权，给监控和 systemd 探活用）
    location /crm/health {
        proxy_pass http://10.113.9.77:8010/health;
        access_log off;
    }
    # ===== CRM V1 入口 END =====
