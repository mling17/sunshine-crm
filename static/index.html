<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>天窗天幕 CRM</title>
  <meta name="description" content="天窗天幕 · 客户档案 / 商机管道 / 跟进记录 / 看板统计">

  <!-- PWA：添加到主屏幕（图标 + manifest；service worker 只做静态壳缓存） -->
  <link rel="manifest" href="/crm/manifest.json">
  <meta name="theme-color" content="#102743">
  <link rel="icon" type="image/png" sizes="192x192" href="/crm/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/crm/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="天幕CRM">

  <link rel="stylesheet" href="/crm/app.css?v=20261031e20">
</head>
<body>

<!-- ===== 顶栏（登录后才显示）===== -->
<header id="topbar" class="topbar" hidden>
  <div class="brand">天窗天幕 CRM</div>
  <nav id="nav" class="nav">
    <a href="#/dashboard" data-view="dashboard">工作台</a>
    <a href="#/leads" data-view="leads">线索</a>
    <a href="#/customers" data-view="customers">客户</a>
    <a href="#/deals" data-view="deals">商机</a>
    <a href="#/orders" data-view="orders">订单</a>
    <a href="#/aftersales" data-view="aftersales">售后</a>
    <a href="#/logistics" data-view="logistics">物流</a>
    <a href="#/stats" data-view="stats">统计</a>
    <a href="#/dict" data-view="dict">数据字典</a>
  </nav>
  <div class="who" id="userMenu">
    <button type="button" id="userBtn" class="user-btn" aria-haspopup="menu" aria-expanded="false">
      <span id="whoami"></span><span class="user-caret" aria-hidden="true">▾</span>
    </button>
    <div class="user-dropdown" id="userDropdown" role="menu" hidden>
      <button type="button" role="menuitem" data-user-action="profile">修改个人信息</button>
      <button type="button" role="menuitem" data-user-action="password">修改密码</button>
      <button type="button" role="menuitem" data-user-action="logout" class="danger">退出登录</button>
    </div>
  </div>
</header>

<!-- ===== 登录页 =====
     需求：电脑端不允许保存密码。
     - 表单 autocomplete="off" 是基础；
     - 密码框必须 autocomplete="new-password"（普通 off 在密码框会被 Chrome/Edge 忽略，
       这个值才会让浏览器不弹「保存密码」）；
     - 密码只存在于这个 input 里，登录成功后立刻清空，绝不写 localStorage/sessionStorage。 -->
<section id="loginView" class="login-wrap" hidden>
  <div class="login-card">
    <h1>天窗天幕 CRM</h1>
    <p class="sub">内网使用 · 登录后 12 小时自动失效</p>
    <form id="loginForm" autocomplete="off" novalidate>
      <div class="field">
        <label for="loginUser">账号</label>
        <input id="loginUser" name="username" type="text" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false"
               inputmode="text" required maxlength="64">
      </div>
      <div class="field">
        <label for="loginPass">密码</label>
        <input id="loginPass" name="password" type="password" autocomplete="new-password"
               required maxlength="256">
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary">登录</button>
      <p id="loginErr" class="err" hidden></p>
    </form>
  </div>
</section>

<!-- ===== 单页壳：所有视图渲染到这里 ===== -->
<main id="app" hidden></main>

<!-- ===== 修改个人信息 ===== -->
<div class="modal" id="profileModal" hidden>
  <div class="modal-overlay" data-close-modal="profileModal"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3>修改个人信息</h3>
      <button type="button" class="modal-close" data-close-modal="profileModal" aria-label="关闭">×</button>
    </div>
    <form id="profileForm" class="modal-body" autocomplete="off">
      <div class="field">
        <label for="profUser">登录账号（不可修改）</label>
        <input id="profUser" name="username" maxlength="64" disabled>
      </div>
      <div class="field">
        <label for="profName">显示名称</label>
        <input id="profName" name="display_name" maxlength="32" placeholder="右上角显示的名字，留空则用登录账号">
      </div>
      <p class="err" id="profErr" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close-modal="profileModal">取消</button>
        <button type="submit" class="btn btn-primary" id="profSubmit">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== 修改密码 ===== -->
<div class="modal" id="passwordModal" hidden>
  <div class="modal-overlay" data-close-modal="passwordModal"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3>修改密码</h3>
      <button type="button" class="modal-close" data-close-modal="passwordModal" aria-label="关闭">×</button>
    </div>
    <form id="passwordForm" class="modal-body" autocomplete="off">
      <div class="field">
        <label for="pwdOld">原密码</label>
        <input id="pwdOld" name="old_password" type="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="pwdNew">新密码</label>
        <input id="pwdNew" name="new_password" type="password" autocomplete="new-password" minlength="6" required>
        <span class="hint">至少 6 位</span>
      </div>
      <div class="field">
        <label for="pwdNew2">确认新密码</label>
        <input id="pwdNew2" name="new_password2" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <p class="err" id="pwdErr" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close-modal="passwordModal">取消</button>
        <button type="submit" class="btn btn-primary" id="pwdSubmit">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<noscript>
  <div class="login-wrap"><div class="login-card">这个页面需要启用 JavaScript 才能使用。</div></div>
</noscript>

<script src="/crm/views/shared.js?v=20261031e20"></script>
<script src="/crm/views/dashboard.js?v=20261031e20"></script>
<script src="/crm/views/leads.js?v=20261031e20"></script>
<script src="/crm/views/customers.js?v=20261031e20"></script>
<script src="/crm/views/deals.js?v=20261031e20"></script>
<script src="/crm/views/orders.js?v=20261031e20"></script>
<script src="/crm/views/aftersales.js?v=20261031e20"></script>
<script src="/crm/views/logistics.js?v=20261031e20"></script>
<script src="/crm/views/followups.js?v=20261031e20"></script>
<script src="/crm/views/stats.js?v=20261031e20"></script>
<script src="/crm/views/import.js?v=20261031e20"></script>
<script src="/crm/views/dict.js?v=20261031e20"></script>
<script src="/crm/app.js?v=20261031e20"></script>
</body>
</html>
